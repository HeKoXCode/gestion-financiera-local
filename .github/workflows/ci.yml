name: Quality checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Lint
        run: python -m ruff check .

      - name: Django system check
        run: python app/manage.py check

      - name: Check migrations
        run: python app/manage.py makemigrations --check --dry-run

      - name: Tests and coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=85

      - name: Verify reproducible demo GIF
        run: |
          python scripts/build_demo_gif.py
          git diff --exit-code -- docs/assets/workflow-demo.gif

  cloud-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.lock

      - name: Install locked cloud dependencies
        run: python -m pip install --require-hashes -r requirements-cloud.lock

      - name: Validate hardened Django settings
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-123456789
          DJANGO_ALLOWED_HOSTS: gestion.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://gestion.example.com
          GESTION_DEPLOYMENT_MODE: multiuser
          GESTION_AUTH_REQUIRED: "1"
          GESTION_DATABASE_ENGINE: postgresql
          GESTION_BEHIND_HTTPS_PROXY: "1"
          PGDATABASE: gestion
          PGUSER: gestion
          PGPASSWORD: ci-only-password
          PGHOST: database.internal
          PGSSLMODE: require
        run: python app/manage.py check --deploy --fail-level ERROR

      - name: Validate container topology
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/compose.yml config --quiet

      - name: Build production image
        run: docker build --tag gestion-financiera:ci .
